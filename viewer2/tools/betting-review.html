<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Betting desk review</title><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../live.css"><link rel="stylesheet" href="../hangar.css"><link rel="stylesheet" href="../broadcast.css"><link rel="stylesheet" href="../betting.css"></head><body data-screen="broadcast" data-phase="betting"><div id="league-shell"><header class="hb-header"><a class="hb-brand">HARD<span>BURN</span><small>THE DUEL LEAGUE</small></a><nav aria-label="Main"><button>Hangar</button><button aria-current="page">Live broadcast</button><button>Results</button></nav><div class="hb-location"><span>LEAGUE / GLOBAL BROADCAST</span><b>LIVE FEED</b></div><div class="hb-wallet"><span>YOUR CREDITS</span><b>500 <small>cr</small></b></div><button id="chat-toggle">Chat off</button></header><main class="hb-broadcast"><div id="hb-stage" class="phase-betting"></div><aside id="hb-chat" hidden><div class="hb-chat-head"><h2>Broadcast chat</h2></div><p>Layout review. No bets or messages are sent.</p></aside></main></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><script type="module">
import { renderBetting } from '../js/live/betting.js';
const crew=(names,skills)=>names.map((name,i)=>({name,station:['pilot','gunner','engineer','ops'][i],skill:skills[i],resistance:[6,9,4,7][i]}));
const fight={id:'review',sequence:354,odds:[.65,.35],oddsSamples:400,betting:{bySide:[3266700,7039000]},ships:[{name:'Ironbark',style:'Reference',crew:crew(['Ruthy Philly','Juster Monson','Cesa Lexand','Joane Hellee'],[.93,.91,1.08,.94])},{name:'Corvid',style:'Knife',crew:crew(['Juany Hernez','Heny Kery','Donnia Flopow','Chrety Brigonz'],[1.07,.93,1.08,1.13])}]};
if(new URLSearchParams(location.search).has('long')){for(const s of fight.ships){s.name='Horizon of Last Light';for(const c of s.crew)c.name='Alexandra Montgomery';}}
const player={balance:50000,maxBet:10000};let draft={side:null,amount:'100'},wager=null;
const stage=document.querySelector('#hb-stage');
function render(){stage.innerHTML=renderBetting({fight,player,draft,wager});stage.querySelector('[data-countdown]').textContent='0:38';}
stage.addEventListener('click',e=>{const p=e.target.closest('[data-side]');if(p&&!wager){draft.side=Number(p.dataset.side);render();stage.querySelector(`[data-side="${draft.side}"]`).focus();}});
stage.addEventListener('keydown',e=>{if(e.target.matches('[data-side]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click();}});
stage.addEventListener('input',e=>{if(e.target.id==='stake')draft.amount=e.target.value;});
stage.addEventListener('submit',e=>{e.preventDefault();wager={side:draft.side,stake:10000,payout:15100};render();});
document.querySelector('#chat-toggle').onclick=e=>{document.body.classList.toggle('hb-chat-open');const on=document.body.classList.contains('hb-chat-open');document.querySelector('#hb-chat').hidden=!on;e.target.textContent=on?'Chat on':'Chat off';};
render();
</script></body></html>
