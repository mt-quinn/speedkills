<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive review</title><link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../live.css"><link rel="stylesheet" href="../hangar.css"><link rel="stylesheet" href="../broadcast.css"><link rel="stylesheet" href="../betting.css"><link rel="stylesheet" href="../results.css"><link rel="stylesheet" href="../archive.css"></head><body data-screen="archive"><div id="league-shell"><header class="hb-header"><a class="hb-brand">HARD<span>BURN</span><small>THE DUEL LEAGUE</small></a><nav aria-label="Main"><button>Hangar</button><button aria-current="page">Live broadcast</button><button>Results</button></nav><div class="hb-location"><span>LEAGUE / GLOBAL BROADCAST</span><b>LIVE FEED</b></div><div class="hb-wallet"><span>YOUR CREDITS</span><b>500 <small>cr</small></b></div><button id="chat-toggle">Chat off</button></header><div id="archive-mount"></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><script type="module">
import {renderArchive} from '../js/live/archive.js';
const names=['Ironbark','Corvid','Kestrel','Halcyon','Marrow','Vesper','Horizon of Last Light'];
const crewNames=['Ruthy Philly','Juster Monson','Cesa Lexand','Joane Hellee','Alexandra Montgomery'];
const ships=names.map((name,i)=>({id:'s'+i,name,style:['Reference','Knife','Counter'][i%3],owner:i===0?'owner':undefined,crew:['pilot','gunner','engineer','ops'].map((station,j)=>({name:crewNames[(i+j)%5],station,skill:.82+(i+j)%6*.07,resistance:2+(i+j)%9}))}));
const rows=Array.from({length:30},(_,i)=>{const p=.21+(i%7)*.09,winner=i%9===0?null:i%3===0?0:1;return {id:'f'+i,sequence:410-i,ships:[ships[i%7],ships[(i+2)%7]],odds:[p,1-p],oddsSamples:400,winner,story:i%2?'The final railgun strike decided the duel.':'The final torpedo strike decided the duel.',stats:[{railShots:12+i%4,railHits:7+i%3,torpedoes:16,intercepts:9,crewSurvived:3,hull:winner===0?8+i%47:0},{railShots:10+i%5,railHits:6+i%4,torpedoes:20,intercepts:11,crewSurvived:4,hull:winner===1?25+i%35:0}],betting:{total:10305600+i*10000,won:4701900,lost:7039000,paidOut:7968600},ownerPayout:47000};});
const mount=document.querySelector('#archive-mount');let state={view:'fights',query:'',filter:'all',sort:'recent',detailTab:'combat'};
function render(){const input=document.activeElement,focused=input?.id==='archive-search',start=input?.selectionStart;mount.innerHTML=renderArchive({rows:new URLSearchParams(location.search).has('empty')?[]:rows,state,ownShipId:'s0'});if(focused){const el=document.querySelector('#archive-search');el.focus();el.setSelectionRange(start,start);}}
mount.addEventListener('input',e=>{if(e.target.id==='archive-search'){state.query=e.target.value;render();}});
mount.addEventListener('change',e=>{if(e.target.id==='archive-filter'||e.target.id==='archive-sort'){state[e.target.id==='archive-filter'?'filter':'sort']=e.target.value;state.detailOpen=false;render();}});
mount.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.archiveView){state.view=b.dataset.archiveView;state.detailOpen=false;}else if(b.dataset.archiveFight||b.dataset.archiveOpenFight){state.view='fights';state.fightId=b.dataset.archiveFight??b.dataset.archiveOpenFight;state.detailOpen=true;state.detailTab='combat';}else if(b.dataset.archiveShip||b.dataset.archiveFocusShip){state.view='ships';state.shipId=b.dataset.archiveShip??b.dataset.archiveFocusShip;state.detailOpen=true;}else if(b.hasAttribute('data-archive-back'))state.detailOpen=false;else if(b.dataset.archiveDetail)state.detailTab=b.dataset.archiveDetail;render();});render();
</script></body></html>
